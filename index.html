<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .setup { color: #fff; font: 16px/1.5 system-ui, sans-serif; padding: 40px 24px; max-width: 520px; margin: 0 auto; }
  .setup b { color: #fac000; }
</style>
</head>
<body>
<script>
  // ▼▼▼ Paste your Apps Script web app URL (ends in /exec) between the quotes ▼▼▼
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwJKW0ti_CppW9fFsPPyxpvzUU4X_i082I042dqbfTXXNqPCmF5pa1QQc7fNY00Uv4/exec';
  // ▲▲▲

  if (/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
    var f = document.createElement('iframe');
    f.src = APP_URL;
    f.title = 'Hutch Hockey Off-Ice';
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="setup"><b>Almost there.</b><br>Open index.html and paste your Apps Script web app URL (the one ending in /exec) into the APP_URL line near the top.</div>';
  }
</script>
</body>
